[build-system]
requires = ["setuptools>=69.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-bot"
version = "0.1.0"
description = "Slack reminder bot for pending GitHub PR reviews"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "slack-sdk>=3.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
